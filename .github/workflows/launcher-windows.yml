name: launcher-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: packages/launcher/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Read launcher version
        id: meta
        working-directory: packages/launcher
        shell: bash
        run: echo "version=$(node -p "require('./wails.json').info.productVersion")" >> "$GITHUB_OUTPUT"

      - name: Build Windows launcher
        working-directory: packages/launcher
        run: wails build -clean -platform windows/amd64 -ldflags "-X vakaohub/launcher/internal/version.Version=${{ steps.meta.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaKaoHub-windows-amd64
          path: packages/launcher/build/bin/*.exe
          if-no-files-found: error
