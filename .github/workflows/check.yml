name: check

# 只做代码检查。手动触发，避免占用 Actions 分钟数。
on:
  workflow_dispatch:

jobs:
  web:
    name: lint（前端与服务端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  go:
    name: vet（启动器）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: packages/launcher/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
