version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'

  build:native:
    summary: Builds the application using native Go cross-compilation
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - cmd: powershell New-Item -ItemType Directory -Force -Path "internal/selfupdate/bin/$($env:GOOS)_$($env:GOARCH)" | Out-Null
        platforms: [windows]
      - cmd: mkdir -p "internal/selfupdate/bin/${GOOS}_${GOARCH}"
        platforms: [linux, darwin]
      # 更新 helper 也必须是 GUI 子系统：它由启动器以 CREATE_NO_WINDOW 拉起，
      # 但自身带控制台时在某些环境下仍会闪窗口，这里从二进制层面去掉控制台。
      - cmd: go build -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o "internal/selfupdate/bin/%GOOS%_%GOARCH%/vakaohub-updater.exe" ./cmd/updater
        platforms: [windows]
      # 交叉编译时宿主是 macOS/Linux，但产物仍是 Windows PE，文件名必须带 .exe；
      # 运行时按 <goos>_<goarch>/vakaohub-updater.exe 读取，缺后缀会导致「更新组件缺失」。
      - cmd: go build -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o "internal/selfupdate/bin/${GOOS}_${GOARCH}/vakaohub-updater.exe" ./cmd/updater
        platforms: [linux, darwin]
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X vakaohub/launcher/internal/version.Version={{.APP_VERSION}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '0'
      GOARCH: '{{.ARCH | default ARCH}}'

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
