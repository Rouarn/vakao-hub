# 该文件包含该项目的配置。
# 当您更新 `info` 或 `fileAssociations` 时，请运行命令 `wails3 task common:update:build-assets` 来更新资产。
# 请注意，这将覆盖您对资产所做的任何更改。
version: '3'

info:
  companyName: "Rouarn"
  productName: "VaKaoHub"
  productIdentifier: "com.wails.vakaohub"
  description: "VaKao Hub Launcher"
  copyright: "Copyright 2026 Rouarn"
  comments: "VaKao Hub Launcher"
  version: "1.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - frontend/bindings
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:

other:
